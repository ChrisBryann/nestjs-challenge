version: '3.3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - 8080:3000
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
  
  mongo:
    image: mongo
    ports:
      - '27017:27017'


volumes:
  node_modules: